<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cabo Punktezähler</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap">
<style>
:root{--bg:#12302a;--card:#f8f4e9;--tile:#fff;--bd:#e6dcc6;--tx:#1a1a1a;--mu:#6f8a73;--gr:#509a6a;--grd:#3b7a52;--ye:#ebb93b;--rd:#d9573f;--tr:#e9e2cf;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
input,button,label{-webkit-tap-highlight-color:transparent;-webkit-appearance:none;appearance:none;outline:none}
input:focus,input:active{background:transparent;outline:none;box-shadow:none}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
html,body{margin:0;overflow-anchor:none}
body{background:var(--bg) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='48'><rect width='60' height='48' fill='%2312302a'/><g transform='translate(0,48) scale(1,-1)' stroke='%230f2823' stroke-width='1.2'><path fill='%23153630' d='M-15 16V-10C-15 -19 -9 -24 0 -24C9 -24 15 -19 15 -10V16Z'/><path fill='%23163a33' d='M15 16V-10C15 -19 21 -24 30 -24C39 -24 45 -19 45 -10V16Z'/><path fill='%23153630' d='M45 16V-10C45 -19 51 -24 60 -24C69 -24 75 -19 75 -10V16Z'/><path fill='%23153630' d='M0 40V14C0 5 6 0 15 0C24 0 30 5 30 14V40Z'/><path fill='%23143229' d='M30 40V14C30 5 36 0 45 0C54 0 60 5 60 14V40Z'/><path fill='%23153630' d='M-15 64V38C-15 29 -9 24 0 24C9 24 15 29 15 38V64Z'/><path fill='%23163a33' d='M15 64V38C15 29 21 24 30 24C39 24 45 29 45 38V64Z'/><path fill='%23153630' d='M45 64V38C45 29 51 24 60 24C69 24 75 29 75 38V64Z'/></g></svg>");background-size:50px 40px;color:var(--tx);font:500 17px/1.35 Nunito,-apple-system,system-ui,sans-serif;padding:24px 16px 40px;max-width:560px;margin:0 auto;min-height:100%}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;color:#f8f4e9}
h1{font:400 52px/1 "Lilita One",Impact,sans-serif;margin:0;letter-spacing:.02em;text-shadow:0 3px 0 rgba(0,0,0,.3)}
h1 span{color:var(--ye)}
.sub{color:#9bb8a2;font-weight:700;margin-top:6px}
h2{font:400 30px/1.1 "Lilita One",Impact,sans-serif;margin:0}
.card{background:var(--card);border-radius:28px;padding:22px 20px;margin-bottom:16px;box-shadow:0 5px 0 #d9d0b8}
.ct{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:18px}
.hint{color:var(--mu);font-weight:700;font-size:15px;text-align:right}
button{font:800 18px Nunito,sans-serif;cursor:pointer;border:0}
.main{width:100%;background:var(--gr);color:#fff;border-radius:18px;padding:16px;box-shadow:0 5px 0 var(--grd)}
.main:active{transform:translateY(3px);box-shadow:0 2px 0 var(--grd)}
.out{background:transparent;border:3px solid var(--bd);color:var(--mu);border-radius:16px;padding:10px 16px;font-size:16px}
.head .out{background:#3f7d62;border-color:#3f7d62;color:#fff;padding:12px 16px;box-shadow:0 4px 0 #2d6049}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.tile{background:var(--tile);border:3px solid var(--bd);border-radius:20px;padding:12px 16px 8px;display:block}
.tile b{display:block;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile input{font:400 40px/1.2 "Lilita One",Impact,sans-serif;border:0;outline:0;background:transparent;width:100%;padding:0;color:var(--tx)}
.tile input::placeholder{color:#a6adbb}
.tile input[type=text]{font:800 20px Nunito,sans-serif;padding:6px 0}
.tile input[type=text]::placeholder{color:#a6adbb}
.pl{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.pl .tile{flex:1;padding:8px 16px}
.pl .rm{background:none;color:var(--mu);font-size:22px;padding:8px}
.rk{display:flex;gap:14px;align-items:flex-start;margin-bottom:20px}
.dot{flex:0 0 46px;height:46px;border-radius:50%;background:var(--tr);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;margin-top:6px}
.rk .in{flex:1;min-width:0}
.rk .r1{display:flex;justify-content:space-between;font-weight:800;font-size:22px}
.bar{height:12px;border-radius:6px;background:var(--tr);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gr);border-radius:6px}
.bar.w i{background:var(--ye)}.bar.d i{background:var(--rd)}
.lead .dot{background:var(--ye)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.win{background:var(--ye);text-align:center}
.win h2{font-size:34px}
.foot{text-align:center;color:#9bb8a2;font-weight:700;font-size:15px;margin-top:20px}
.tw{overflow-x:auto}
.st{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 12px 10px 16px}
.sv{min-width:0}
.num{display:block;font:400 40px/1.2 "Lilita One",Impact,sans-serif}
.sp{display:flex;flex-direction:column;gap:6px}
.sp button{width:46px;height:38px;border-radius:12px;background:#f8f4e9;color:var(--mu);font-size:26px;line-height:1;padding:0;box-shadow:inset 0 4px 0 #ddd2b8}
.sp button:active{box-shadow:inset 0 5px 0 #d2c6a8}
.tile.dis .sp button{box-shadow:inset 0 4px 0 #ddd2b8}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tb{background:transparent;border:3px solid #3d6b5a;color:#9bb8a2;border-radius:999px;padding:6px 16px;font-size:15px}
.tb.on{background:var(--card);border-color:var(--card);color:var(--tx)}
@keyframes inR{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
.inR{animation:inR .25s ease}.inL{animation:inL .25s ease}
.tile.dis{opacity:.4;background:var(--tr);pointer-events:none}
.tile.dis input{color:var(--mu)}
.sw{width:58px;height:34px;border-radius:17px;background:var(--tr);position:relative;padding:0;align-self:center;flex:0 0 auto}
.sw i{position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15);transition:left .15s}
.sw.on{background:var(--gr)}
.sw.on i{left:28px}
.mu{color:var(--mu);font-weight:700;font-size:15px}
.gm{padding:12px 0;border-bottom:3px solid var(--bd)}
.gm:last-child{border:0;padding-bottom:0}
.gm .g1{display:flex;justify-content:space-between;font-weight:800;font-size:19px;margin-bottom:2px;gap:8px}
.rt th{line-height:1.15}
.rt td:nth-child(2),.rt th:nth-child(2){text-align:left;color:var(--tx);font-weight:800}
.rt th:nth-child(2){color:var(--mu)}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 6px;text-align:center;font-weight:700}
th{color:var(--mu);font-size:14px}
td:first-child,th:first-child{text-align:left;color:var(--mu)}
tr.t td{border-top:3px solid var(--bd);font-weight:800}
</style>
</head>
<body>
<div id="app"></div>
<script>
var view='main';
var S={phase:'setup',players:['','','',''],limit:100,maxRounds:10,useRounds:false,rounds:[],history:[],rec:false};
try{var raw=localStorage.getItem('cabo2');if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
if(!S.rl){S.rl=1;S.useRounds=false}
function save(){try{localStorage.setItem('cabo2',JSON.stringify(S))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function nm(i){return S.players[i].trim()||('Spieler '+(i+1))}
function totals(){return S.players.map(function(_,i){return S.rounds.reduce(function(a,r){var n=a+(r[i]||0);return n===S.limit?Math.round(S.limit/2):n},0)})}

function render(){
  var y=window.scrollY;
  document.getElementById('app').innerHTML=S.phase==='game'?gameV():setupV();
  window.scrollTo(0,y);
  save();
}
function head(btn){
  return'<div class="head"><div><h1>CABO</h1><div class="sub">Punktezähler · Limit: '+S.limit+' Punkte'+(S.useRounds?' · '+S.maxRounds+' Runden':'')+'</div></div>'+btn+'</div>';
}

function setupV(){
  if(S.phase==='setup'&&view==='rank')return head('')+tabs()+rankV();
  var edit=S.phase==='edit',h=head('')+(edit?'':tabs());
  h+='<div class="card"><div class="ct"><h2>Spieler</h2></div>';
  S.players.forEach(function(p,i){
    h+='<div class="pl"><label class="tile"><input type="text" enterkeyhint="done" placeholder="Spieler '+(i+1)+'" value="'+esc(p)+'" oninput="S.players['+i+']=this.value;save()"></label>'+
    (!edit&&S.players.length>2?'<button class="rm" onclick="rmP('+i+')">✕</button>':'')+'</div>';
  });
  if(!edit&&S.players.length<8)h+='<button class="out" onclick="addP()">+ Spieler</button>';
  h+='</div><div class="card"><div class="ct"><h2>Limit</h2></div><label class="tile"><b>Spielende bei mehr als</b><input type="number" inputmode="numeric" value="'+S.limit+'" onchange="S.limit=Math.max(10,+this.value||100);save()"></label></div>';
  h+='<div class="card"><div class="ct"><h2>Runden</h2><button class="sw'+(S.useRounds?' on':'')+'" onclick="S.useRounds=!S.useRounds;render()"><i></i></button></div><div class="tile st'+(S.useRounds?'':' dis')+'"><div class="sv"><b>Spielende nach Runden</b><span class="num">'+S.maxRounds+'</span></div><div class="sp"><button onclick="step(1)">+</button><button onclick="step(-1)">−</button></div></div></div>';
  h+='<button class="main" onclick="'+(edit?'back()':'start()')+'">'+(edit?'Fertig':'Spiel starten')+'</button>';
  if(!edit)h+=histV();
  return h;
}
function step(d){S.maxRounds=Math.min(99,Math.max(1,S.maxRounds+d));render()}
function addP(){S.players.push('');render()}
function rmP(i){S.players.splice(i,1);render()}
function start(){S.rounds=[];S.rec=false;S.phase='game';render()}
function back(){S.phase='game';sync();render()}
function editP(){S.phase='edit';render()}

function gameV(){
  var t=totals(),min=Math.min.apply(null,t),over=isOver(t);
  var h=head('<button class="out" onclick="newG()">Neues Spiel</button>');
  var n=S.rounds.length+1;
  if(over){
    var w=t.map(function(x,i){return x===min?nm(i):null}).filter(Boolean).join(' & ');
    h+='<div class="card win"><h2>🏆 '+esc(w)+'</h2><div class="hint" style="text-align:center;color:#5c4a12">'+min+' Punkte</div></div>';
  }else{
    h+='<div class="card"><div class="ct"><h2>Runde '+n+(S.useRounds?' von '+S.maxRounds:'')+'</h2><span class="hint">Leer lassen = 0 Punkte</span></div><div class="grid">';
    S.players.forEach(function(_,i){
      h+='<label class="tile"><b>'+esc(nm(i))+'</b><input type="number" inputmode="numeric" id="t'+i+'" placeholder="0"></label>';
    });
    h+='</div><button class="main" onclick="addR()">Runde '+n+' speichern</button></div>';
  }
  var order=t.map(function(x,i){return i}).sort(function(a,b){return t[a]-t[b]||a-b});
  h+='<div class="card"><div class="ct"><h2>'+(over?'Endstand':S.rounds.length?'Zwischenstand':'Startaufstellung')+'</h2></div>';
  order.forEach(function(i,k){
    var rank=order.findIndex(function(j){return t[j]===t[i]})+1;
    var p=Math.max(0,Math.min(100,t[i]/S.limit*100));
    h+='<div class="rk'+(S.rounds.length&&t[i]===min?' lead':'')+'"><div class="dot">'+rank+'</div><div class="in"><div class="r1"><span>'+esc(nm(i))+'</span><span>'+t[i]+'</span></div><div class="bar'+(t[i]>S.limit?' d':p>80?' w':'')+'"><i style="width:'+p+'%"></i></div></div></div>';
  });
  h+='<div class="btns"><button class="out" onclick="editP()">Spieler bearbeiten</button>'+(S.rounds.length?'<button class="out" onclick="undo()">↶ Letzte Runde</button>':'')+'</div></div>';
  if(S.rounds.length){
    h+='<div class="card"><div class="ct"><h2>Verlauf</h2></div><div class="tw"><table><tr><th></th>'+S.players.map(function(_,i){return'<th>'+esc(nm(i))+'</th>'}).join('')+'</tr>';
    S.rounds.forEach(function(r,k){h+='<tr><td>'+(k+1)+'</td>'+S.players.map(function(_,i){return'<td>'+(r[i]||0)+'</td>'}).join('')+'</tr>'});
    h+='<tr class="t"><td>Σ</td>'+t.map(function(x){return'<td>'+x+'</td>'}).join('')+'</tr></table></div></div>';
  }
  return h+'<div class="foot">Der Spielstand wird automatisch gespeichert.</div>';
}

function isOver(t){return (S.useRounds&&S.rounds.length>=S.maxRounds)||t.some(function(x){return x>S.limit})}
function sync(){
  var t=totals(),over=isOver(t);
  if(over&&!S.rec){
    var min=Math.min.apply(null,t);
    S.history.unshift({d:Date.now(),p:S.players.map(function(p,i){return{n:p.trim(),t:t[i]}}),w:t.map(function(x,i){return x===min?i:-1}).filter(function(i){return i>=0})});
    S.history=S.history.slice(0,50);S.rec=true;
  }else if(!over&&S.rec){S.history.shift();S.rec=false}
}
function pn(p,i){return p.n||('Spieler '+(i+1))}
function tabs(){
  return'<div class="tabs"><button class="tb'+(view==='main'?' on':'')+'" onclick="setView(\'main\')">Spiel</button><button class="tb'+(view==='rank'?' on':'')+'" onclick="setView(\'rank\')">Rangliste</button></div>';
}
var busy=false;
function anim(tr,tf,op){[].slice.call(document.querySelectorAll('#app > :not(.head):not(.tabs)')).forEach(function(e){e.style.transition=tr;e.style.transform=tf;e.style.opacity=op})}
function pgs(){return [].slice.call(document.querySelectorAll('#app > :not(.head):not(.tabs)'))}
function setView(v){
  if(S.phase!=='setup'||view===v||busy)return;
  busy=true;
  var d=v==='rank'?-1:1,old=pgs(),g=null;
  if(old.length){
    var r=old[0].getBoundingClientRect();
    g=document.createElement('div');
    g.style.cssText='position:absolute;pointer-events:none;top:'+(r.top+window.scrollY)+'px;left:'+r.left+'px;width:'+r.width+'px;will-change:transform,opacity';
    old.forEach(function(e){g.appendChild(e.cloneNode(true))});
    document.body.appendChild(g);
  }
  view=v;render();
  anim('none','translateX('+(-d*24)+'px)','0');
  void document.body.offsetWidth;
  if(g){g.style.transition='transform .3s ease,opacity .24s ease';g.style.transform='translateX('+(d*24)+'px)';g.style.opacity='0'}
  anim('transform .34s cubic-bezier(.2,.7,.2,1),opacity .3s ease','none','1');
  setTimeout(function(){if(g&&g.parentNode)g.parentNode.removeChild(g);busy=false},340);
}
function histV(){
  if(!S.history.length)return'';
  var h='<div class="card" style="margin-top:16px"><div class="ct"><h2>Letzte Spiele</h2></div>';
  S.history.slice(0,5).forEach(function(g){
    var d=new Date(g.d).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'});
    var ord=g.p.map(function(_,i){return i}).sort(function(a,b){return g.p[a].t-g.p[b].t||a-b});
    h+='<div class="gm"><div class="g1"><span>🏆 '+esc(g.w.map(function(i){return pn(g.p[i],i)}).join(' & '))+'</span><span class="mu">'+d+'</span></div><div class="mu">'+ord.map(function(i){return esc(pn(g.p[i],i))+' '+g.p[i].t}).join(' · ')+'</div></div>';
  });
  return h+'</div>';
}
function rankV(){
  var h='',st={};
  S.history.slice(0,20).forEach(function(g){g.p.forEach(function(p,i){
    var k=p.n.toLowerCase();if(!k)return;
    var o=st[k]||(st[k]={n:p.n,g:0,w:0});o.g++;if(g.w.indexOf(i)>-1)o.w++;
  })});
  var arr=Object.keys(st).map(function(k){return st[k]}).sort(function(a,b){return b.w-a.w||b.w/b.g-a.w/a.g||b.g-a.g});
  if(arr.length){
    h+='<div class="card"><div class="ct"><h2>Rangliste</h2><span class="hint">Letzte 20 Spiele</span></div><div class="tw"><table class="rt"><tr><th>#</th><th>Name</th><th>Runden<br>gespielt</th><th>Runden<br>gewonnen</th><th>Quote</th></tr>';
    arr.forEach(function(o,i){h+='<tr><td>'+(i+1)+'</td><td>'+esc(o.n)+'</td><td>'+o.g+'</td><td>'+o.w+'</td><td>'+Math.round(o.w/o.g*100)+' %</td></tr>'});
    h+='</table></div></div>';
  }
  if(!h)h='<div class="card"><div class="hint" style="text-align:center">Noch keine beendeten Spiele</div></div>';
  return h;
}
function addR(){
  var r=S.players.map(function(_,i){return parseInt(document.getElementById('t'+i).value,10)||0});
  S.rounds.push(r);sync();render();window.scrollTo(0,0);
}
function undo(){S.rounds.pop();sync();render()}
function newG(){S.phase='setup';view='main';S.rounds=[];S.rec=false;render();window.scrollTo(0,0)}
render();
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.tagName==='INPUT')e.target.blur();
});
document.addEventListener('pointerdown',function(e){
  var a=document.activeElement;
  if(a&&a.tagName==='INPUT'&&e.target!==a&&!(e.target.closest&&e.target.closest('label,button'))&&e.target.tagName!=='INPUT')a.blur();
});
document.addEventListener('mousedown',function(e){
  if(e.target.closest&&e.target.closest('button'))e.preventDefault();
});
</script>
</body>
</html>
